services:
  - type: web
    name: visionaltrix
    plan: free
    runtime: python
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
    buildCommand: pip install --upgrade pip && pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
